<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Now</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <nav>
      <div class="nav__container">
        <h1 class="nav__title">
          Movie <br />
          Now
        </h1>
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="movie.html" class="nav__link">Movies</a></li>
          <li><button class="nav__link">Contact</button></li>
        </ul>
      </div>
    </nav>
    <section id="landing-page">
      <header class="landing">
        <div class="landing__wrapper">
          <h2 class="landing__title">
            Welcome to <br />
            <span class="purple big">Movie Now</span>
          </h2>
          <p class="landing__para">
            Ultimate destination for movie information.
          </p>
          <form id="search__wrapper">
            <input type="text" id="search-input" placeholder="Search for movies..." />
            <button type="submit" class="search__btn">Search</button>
          </form>
          <img
            class="landing__photo"
            src="./assets/filmstrip_PNG23.png"
            alt=""
          />
        </div>
      </header>
    </section>
    <div id="filter-container" class="filter-container">
      <select id="movie-filter" name="movie">
        <option value="">Sort by</option>
        <option value="A_TO_Z">A to Z</option>
        <option value="Z_TO_A">Z to A</option>
        <option value="NEW_TO_OLD">New to Old</option>
        <option value="OLD_TO_NEW">Old to New</option>
      </select>
    </div>
    <div class="movie"></div>
    <footer>
      <div class="container">
        <div class="row">
          <p>&copy; 2026 Movie Now. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
