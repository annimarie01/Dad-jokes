<!doctype html>

    <title>Movie Now</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="landing-page">
      <nav class="nav">
        <h1 class="nav__title">Movie <br> Now</h1>

          <li><a href="#" class="nav__link">Movies</a></li>
