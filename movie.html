<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Now</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>

    <nav>
      <div class="nav__container">
        <h1 class="nav__title">

              <div class="movie__runtime">136 min</div>
              <div class="movie__genre">Action, Adventure, Comedy</div>

    <footer>
      <div class="container">
        <div class="row">
